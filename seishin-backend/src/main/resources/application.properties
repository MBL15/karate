spring.application.name=karate-hub
server.port=8080

spring.datasource.url=jdbc:h2:mem:seishin;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

seishin.jwt.secret=seishin-dev-secret-change-in-production-min-32-chars
seishin.jwt.expiration-hours=24
seishin.otp.ttl-minutes=5
seishin.otp.dev-code=123456
seishin.invite.ttl-hours=24
# Dev: Vite (http://localhost:*), Capacitor WebView (https://localhost, capacitor://localhost).
seishin.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://localhost,capacitor://localhost,ionic://localhost

logging.level.com.seishin=INFO

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
